name: Android APK

# Builds the debug APK on GitHub's servers so no local Android toolchain is
# needed. Run it from the Actions tab ("Run workflow") or push to a branch that
# touches the Android project or the platform layer, then download the
# `pokeemerald-android-debug` artifact from the finished run.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'src/platform/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout (with SDL2 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages (uses the SDK already on the runner)
        run: |
          SDKM="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "Using sdkmanager at: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "ndk;26.3.11579264" "cmake;3.22.1" "build-tools;36.0.0"

      - name: Install ARM assembler/linker for the game data
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev

      - name: Build the preprocessor tool used by the CMake build
        run: make -C tools/preproc

      - name: Generate map headers, graphics and audio assets
        run: |
          set -e
          make -f make_tools.mk -j"$(nproc)"
          make -f Makefile_pc generated -j"$(nproc)"
          # Per-map header.inc / events.inc / connections.inc used by data/maps.s and data/map_events.s
          make -f Makefile_pc -j"$(nproc)" $(ls data/maps/*/map.json | sed -e 's#map\.json$#header.inc#') $(ls data/maps/*/map.json | sed -e 's#map\.json$#events.inc#') $(ls data/maps/*/map.json | sed -e 's#map\.json$#connections.inc#')
          # MIDI songs -> assembly (the CMake build globs these at configure time)
          make -f Makefile_pc -j"$(nproc)" $(ls sound/songs/midi/*.mid | sed 's/\.mid$/.s/')
          # Per-map header/events/connections include files used by data/maps.s and data/map_events.s
          make -f Makefile_pc -j"$(nproc)" $(for m in data/maps/*/map.json; do d=$(dirname "$m"); echo "$d/header.inc $d/events.inc $d/connections.inc"; done)
          # Everything the .s and .c files embed (INCBIN): graphics, palettes, samples
          {
            for f in data/*.s sound/songs/*.s sound/songs/midi/*.s; do
              tools/scaninc/scaninc -I include -I . "$f"
            done
            find src -name '*.c' ! -name '*.inc.c' | while read -r f; do
              tools/scaninc/scaninc -I include -I gflib "$f"
            done
          } | sort -u | grep -v '^$' > /tmp/asset_deps.txt
          while read -r d; do [ -e "$d" ] || echo "$d"; done < /tmp/asset_deps.txt > /tmp/asset_missing.txt
          echo "Generating $(wc -l < /tmp/asset_missing.txt) missing asset files"
          xargs -n 400 make -f Makefile_pc -j"$(nproc)" < /tmp/asset_missing.txt
          while read -r d; do [ -e "$d" ] || { echo "STILL MISSING: $d"; exit 1; }; done < /tmp/asset_deps.txt
          # The CMake build assembles these through a pipeline that hides preprocessor
          # failures (a missing include silently truncates the output), so check here.
          for f in data/*.s; do
            tools/preproc/preproc "$f" charmap.txt > /dev/null || { echo "PREPROC FAILED: $f"; exit 1; }
          done
          # preproc only warns (and truncates its output) when an included file is missing,
          # which later shows up as undefined symbols at link time. Fail early instead.
          for f in data/*.s; do
            tools/preproc/preproc "$f" charmap.txt | cpp -I include -DMODERN=1 -DPORTABLE -DUBFIX 2>/dev/null \
              | tools/preproc/preproc -ie "$f" charmap.txt 2>/tmp/preproc_err.txt >/dev/null
            if grep -q "Failed to open" /tmp/preproc_err.txt; then
              echo "preproc could not read an included file while processing $f:"; cat /tmp/preproc_err.txt; exit 1
            fi
          done

      - name: Apply the SDL2 Android lifecycle patch
        run: git -C android/SDL2 apply --unidiff-zero ../patches/sdl2-android-lifecycle.patch

      - name: Build debug APK
        run: android/SDL2/android-project/gradlew -p android :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
